[package]
name = "a2a-web-client"
version = "0.7.2"
edition = "2024"
rust-version.workspace = true
authors = ["Emil Lindfors <emil@lindfors.no>"]
description = "Generic web client library for building A2A agent frontends"
license = "MIT"
repository = "https://github.com/emillindfors/a2a-rs"
keywords = ["a2a", "agent", "client", "web"]
categories = ["api-bindings", "web-programming"]

[lib]
name = "a2a_client"

[dependencies]
# A2A integration
# Note: We need "server" feature for the port traits even though this is a client library
a2a-rs = { path = "../a2a-rs", version = "0.9", features = ["http-client", "jsonrpc-client", "server", "tracing"], default-features = false }
buffa = { version = "0.3.0", features = ["json"] }

# Async runtime
tokio = { workspace = true, features = ["time"] }

# Web framework. 0.8 matches `a2a-rs` and `a2a-cli`; this crate was the last
# 0.7 in the workspace, and its version reached every dependent that wanted the
# SSE helper.
axum = { version = "0.8", optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Async streams
futures = { workspace = true }

# UUID generation
uuid = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
wiremock = "0.6"
axum = "0.8"
futures-util = "0.3"
async-trait = { workspace = true }

[features]
default = ["axum-components"]
# `async-stream` used to be listed here and is not imported anywhere in the
# crate; dropped rather than carried.
axum-components = ["dep:axum"]
