[workspace]
resolver = "2"
members = ["a2a-rs", "a2a-client", "a2a-ap2", "a2a-llm", "a2a-mcp", "a2a-cli"]
exclude = ["a2a-mcp/rust-sdk"]

# Package metadata shared by every member (`field.workspace = true`), for the
# same anti-drift reason as the dependency table below: seven copies of a
# version number is seven chances to update six of them.
[workspace.package]
# The toolchain this workspace is built and tested with, and the one the agent
# container image pins (korps' `Dockerfile`). Deliberately not the lowest
# version that would compile: an MSRV nobody runs is a guess, and the previous
# claim of 1.85 had already become false — the dependency graph now needs 1.87+
# (`icu_*` want 1.86, `process-wrap` 1.87), which surfaced only when the
# container image failed to build. Raising this is a breaking change for
# consumers on older toolchains; lower it only alongside a CI job that proves
# the lower number.
rust-version = "1.96"

# Common dependencies shared across workspace members. Members reference these
# with `dep.workspace = true`, adding `features`/`optional`/`default-features`
# locally as needed (those compose; the version is pinned here once). Keeps the
# versions from drifting (the previous `thiserror = "1.0"` vs `"2"` split).
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.4", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
futures = "0.3"
# TLS roots are decided here, once, for every crate that speaks HTTPS.
#
# reqwest 0.13's `rustls` feature verifies against the *platform* trust store
# (rustls-platform-verifier): on Linux that is the OS bundle, or `SSL_CERT_FILE`
# / `SSL_CERT_DIR` instead when either is set — so an operator behind a
# TLS-intercepting proxy (a corporate MITM gateway, a Docker Sandbox signing
# egress with its own CA) fixes it the way they fix curl. What 0.12 had and
# this does not is a compiled-in webpki floor: a machine with no CA bundle at
# all now fails to build a client ("No CA certificates were loaded from the
# system") rather than reaching public APIs — which is why nothing in this
# workspace calls `reqwest::Client::new()` (it unwraps the builder): every
# client goes through a fallible `http_client()`. An image that ships an agent
# ships `ca-certificates`.
#
# `rustls` also brings the aws-lc-rs provider; a process that installed
# another (the ConnectRPC client installs ring) keeps its own. See `NOTES.md`.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
] }
bon = "2.3"
tokio = "1.32"
