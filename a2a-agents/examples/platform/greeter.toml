# Greeter — the agent this walkthrough deploys. See README.md.
#
# Deliberately an `echo` handler: the platform lifecycle (deploy, health, logs,
# stop) is the subject here, and an agent that needs no API key keeps every
# command in the README runnable, in CI as well as on a laptop.

[agent]
name = "Greeter"
description = "Greets whoever writes to it."
version = "0.1.0"

[server]
# 127.0.0.1 keeps the agent off the network while you try this. The container
# image sets HOST=0.0.0.0; omit `host` entirely to inherit that.
host = "127.0.0.1"
http_port = 8081

[server.storage]
type = "inmemory"

[[skills]]
id = "greet"
name = "Greet"
description = "Return a greeting."
keywords = ["greet", "hello"]
examples = ["Say hello"]
input_formats = ["text"]
output_formats = ["text"]

[handler]
type = "echo"

[features]
streaming = true
push_notifications = false
state_history = true
