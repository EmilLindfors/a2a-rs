# The two agents above, as one deployable system.
#
# Member paths are relative to this file, so the fleet runs from any directory:
#
#   a2a validate --fleet examples/platform/fleet.toml   # check, bind nothing
#   a2a up       -f      examples/platform/fleet.toml   # run both locally
#   a2a deploy   --fleet examples/platform/fleet.toml   # hand both to a control plane

name = "Platform Walkthrough"

[[agents]]
config = "greeter.toml"

[[agents]]
config = "notifier.toml"
