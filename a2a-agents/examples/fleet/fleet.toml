# Three agents as one deployable system. See README.md.
#
# Member paths are relative to this file, so the fleet runs from any directory:
#
#   a2a validate --fleet a2a-agents/examples/fleet/fleet.toml   # check, bind nothing
#   a2a up       -f      a2a-agents/examples/fleet/fleet.toml   # run all three locally
#   a2a deploy   --fleet a2a-agents/examples/fleet/fleet.toml   # hand them to a control plane
#
# `a2a up` runs every member in one process sharing one agent registry, which is
# what lets the orchestrator find its peers by skill instead of by URL.

name = "Fleet Walkthrough"

# The specialist that needs no model at all.
[[agents]]
config = "greeter.toml"

# The specialist that does, and pins its own.
[[agents]]
config = "analyst.toml"

# The router that finds both by skill.
[[agents]]
config = "orchestrator.toml"
