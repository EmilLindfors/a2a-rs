# Orchestrator — routes a request to whichever member can serve it.
#
# Peers are named by the **skill** they advertise, not by URL, and resolved
# against the agent registry when the model calls the tool. So an agent that
# moves, or that is deployed after this one, is still reachable — and one that is
# down comes back as a tool result the model can route around rather than an
# error that fails the request.

[agent]
name = "Orchestrator"
description = "Understands a request and delegates it to the right specialist."
version = "0.1.0"

[server]
host = "127.0.0.1"
http_port = 8090

[server.storage]
type = "inmemory"

[handler]
type = "llm"

[handler.llm]
system_prompt = "You are an orchestrator. Match each request to the specialist tool that fits it, call that tool, and relay its answer. Answer directly only when no tool fits."
max_tool_rounds = 4

# Each entry becomes one `ask_<slug>` tool the model can call. Name the peer by
# exactly one of `skill`, `agent_id`, or `url`.
[[handler.llm.agents]]
name = "Greeter"
skill = "greet"
description = "Greets someone. Use for hellos and introductions."

[[handler.llm.agents]]
name = "Analyst"
skill = "data-analysis"
description = "Summarizes figures and explains trends. Use for numbers, reports, and analysis."

[[skills]]
id = "route"
name = "Route"
description = "Understand a request and delegate it to the specialist that fits."
keywords = ["route", "delegate", "orchestrate"]
examples = ["Say hello to the team", "Summarize these Q3 numbers: 12, 40, 38, 91"]
input_formats = ["text"]
output_formats = ["text"]

# Routing is a tool choice, not a research problem — a cheap model with a little
# thinking is the right pick here. Uncomment to pin one (see analyst.toml).
#
# [llm]
# provider = "openrouter"
# model = "deepseek/deepseek-v4-flash-0731"
# reasoning = "low"

[features]
streaming = true
push_notifications = false
state_history = true
