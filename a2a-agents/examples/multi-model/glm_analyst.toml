# GLM 5.2 worker — a stronger general-purpose model for structured/complex work.
#
# Model: z-ai/glm-5.2 (in $0.50/M, out $3.15/M, 1M ctx) — heavier than Flash,
#       better at reasoning over structured data. Note the output price: this is
#       the one to point at work worth paying for, not at routine chatter.
# Skill: data-analysis. Pinned via [llm] so OPENROUTER_MODEL cannot change it.

[agent]
name = "GLM Analyst"
description = "Structured data analysis and summarization."
version = "0.1.0"

[server]
host = "127.0.0.1"
http_port = 8082

[server.storage]
type = "inmemory"

[[skills]]
id = "data-analysis"
name = "Data analysis"
description = "Analyze structured data, summarize figures, and explain trends."
keywords = ["analyze", "summary", "data", "report"]
examples = ["Summarize these Q3 numbers", "Explain the trend in this data"]
input_formats = ["text"]
output_formats = ["text"]

[handler]
type = "llm"

[handler.llm]
system_prompt = "You are a careful analyst. Do precise work, show your reasoning, then answer concisely."
max_tool_rounds = 3

[llm]
provider = "openrouter"
model = "z-ai/glm-5.2"
# The one agent here worth paying to think: analysis over structured data is
# exactly what high effort buys, and the streamed "AI Thinking..." artifacts show
# it happening.
reasoning = "high"

[features]
streaming = true
push_notifications = false
state_history = true
