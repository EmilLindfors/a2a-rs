# release-plz configuration — https://release-plz.dev/docs/config
#
# Tag convention: per-crate `{package}-v{version}` (release-plz's default, made
# explicit here). Each crate tags and releases itself; there is no umbrella `v*`
# tag. The `release` job (see .github/workflows/release-plz.yml) runs on push to
# master and publishes only the crates whose Cargo.toml version is ahead of
# crates.io, tagging each one. An `a2acli-v*` tag is what release-binaries.yml
# builds prebuilt binaries from; that trigger fires on its own once the
# RELEASE_PLZ_APP_ID variable and RELEASE_PLZ_APP_PRIVATE_KEY secret are set,
# since a tag pushed with the default GITHUB_TOKEN does not start a workflow.
#
# Why this file exists: 0.3.0 produced wrong changelog compare-links because the
# repo carried both per-crate tags and a manual umbrella `v0.3.0` tag, so the
# links pointed at inconsistent refs. Standardizing on per-crate tags + the
# release-plz `release_link` variable (which derives the compare URL from the
# tag template below) keeps them correct.

[workspace]
# Per-crate tag + GitHub release names.
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"
# All crates publish together; keep the changelog/PR per-crate.
git_release_body = "{{ changelog }}"

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""

# `release_link` is supplied by release-plz and resolves to the correct
# `compare/{prev}...{curr}` URL for the per-crate tag template above — this is
# what fixes the 0.3.0 broken compare-links.
body = """
## [{{ version | trim_start_matches(pat="v") }}]\
{% if release_link %}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

# Conventional-commit routing. feat/fix/perf/refactor/docs get their own
# group; everything else lands under "Other".
#
# Nothing is skipped, on purpose. release-plz only hands git-cliff the commits
# that touched the crate being released, and git-cliff drops a release whose
# commit list comes out empty (git-cliff-core `process_releases`). release-plz
# then cannot find the `## [x.y.z]` heading in its own output, gives up
# stripping the header, and splices a second `# Changelog` header into the file
# where the entry should be (`compose_changelog` in release_plz_core). Every
# dependency-only bump did exactly that between 2026-08-15 and 2026-09-03 —
# the note release-plz writes for those is itself a `chore:` commit ("chore:
# updated the following local packages: a2a-rs"), which the old `^chore` skip
# ate — and on 2026-09-03 it became a loop: release-plz decides a crate needs
# publishing by diffing the package against the crates.io tarball, CHANGELOG.md
# included, so each merged garbage header was a new diff, proposing another
# patch release whose only commit was the previous `chore: release`, skipped
# again. a2a-ap2 0.4.5 and a2a-web-client 0.7.2 were published with no change
# at all that way.
#
# There is no template-side escape: `[changelog]` here rejects unknown keys and
# does not expose git-cliff's `render_always`. So a `chore:`/`build:`/`ci:`/
# `style:`/`test:` commit that actually changed a crate's packaged files gets
# its one line under "Other" — which is also accurate, since it did trigger the
# release. Commits that never touch a crate directory (CI config, root docs)
# still never appear, because release-plz never selects them.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs?", group = "Documentation" },
  { message = ".*", group = "Other" },
]
protect_breaking_commits = true
