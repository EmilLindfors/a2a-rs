name: Release Binaries

# Prebuilt `a2acli` binaries for the five targets below, attached to its release.
#
# `a2acli` is the only binary this repo ships — the agent runner moved to korps
# along with the rest of the platform, so this used to build `-p a2a-agents
# --bin a2a`, a package that no longer exists here.
#
# Invoked as a reusable workflow by release-plz.yml, as a dependent job of the
# release that just published a2acli - see the `release-binaries` job there. The
# tag comes in as an input rather than from a `push: tags:` event, because
# release-plz pushes tags with GITHUB_TOKEN and a token-pushed tag does not start
# a workflow; relying on that event is what made every release need a manual
# dispatch. `workflow_dispatch` is kept for rebuilding assets on an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and upload binaries for (e.g. a2acli-v0.6.2)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and upload binaries for (e.g. a2acli-v0.6.2)"
        required: true
        type: string

permissions:
  contents: write

env:
  # Force Node 20-pinned JavaScript actions onto Node 24 (silences the
  # deprecation annotation until the actions update).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upload-assets:
    name: Build and upload binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release -p a2acli --bin a2acli --target ${{ matrix.target }}
          else
            cargo build --release -p a2acli --bin a2acli --target ${{ matrix.target }}
          fi

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czvf a2acli-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release a2acli

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/a2acli.exe -DestinationPath a2acli-${{ matrix.target }}.zip

      - name: Upload Release Asset (Unix)
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: a2acli-${{ matrix.target }}.tar.gz

      - name: Upload Release Asset (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: a2acli-${{ matrix.target }}.zip
