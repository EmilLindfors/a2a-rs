name: Downstream canary (korps)

# Nothing in this repo depends on korps, so the compiler never sees a change
# that breaks it. The shared workspace used to catch that; since the platform
# moved out, this job is the replacement.
#
# korps depends on published a2a-rs, so it has to be *told* to build against
# this PR. The job writes a `[patch.crates-io]` section into korps' workspace
# manifest pointing at the PR checkout:
#
#   $GITHUB_WORKSPACE/a2a-rs   <- the PR
#   $GITHUB_WORKSPACE/korps    <- patched to build against it
#
# korps carried such a patch itself until 2026-08-18, which made this work
# without the injection step. It does not any more, and a canary that builds
# korps against the *published* a2a-rs would pass no matter what this PR does.
#
# Two setup steps are needed before this is worth trusting:
#
#  1. korps is a private repo, so cloning it from this public one needs a PAT
#     with `repo` scope in the `KORPS_CANARY_TOKEN` secret. Without it the job
#     skips rather than fails, so forks and PRs without access stay green.
#  2. korps' master has to be current. While it lags, this builds an old korps
#     against new a2a-rs and can fail for reasons that have nothing to do with
#     the PR — which is why it is advisory today.
#
# Drop `continue-on-error` and make it a required check once both hold.

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  korps:
    name: korps builds against this PR
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Is the canary configured?
        id: guard
        env:
          TOKEN: ${{ secrets.KORPS_CANARY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Downstream canary skipped::KORPS_CANARY_TOKEN is not set, so korps cannot be cloned. See the header of .github/workflows/downstream-korps.yml."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out a2a-rs (this PR)
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          path: a2a-rs

      - name: Check out korps
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          repository: EmilLindfors/korps
          token: ${{ secrets.KORPS_CANARY_TOKEN }}
          path: korps

      - name: Install Rust toolchain
        if: steps.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        if: steps.guard.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: korps

      # Point korps at this PR. Appended rather than templated over the file so
      # the rest of korps' manifest — the version requirements it declares — is
      # exactly what a real consumer has. A patch keeps those requirements and
      # swaps the source, so a PR that breaks korps' *declared* API surface
      # still fails here.
      - name: Patch korps onto this checkout
        if: steps.guard.outputs.run == 'true'
        working-directory: korps
        run: |
          cat >> Cargo.toml <<'PATCH'

          [patch.crates-io]
          a2a-rs = { path = "../a2a-rs/a2a-rs" }
          a2a-llm = { path = "../a2a-rs/a2a-llm" }
          a2a-mcp = { path = "../a2a-rs/a2a-mcp" }
          a2a-ap2 = { path = "../a2a-rs/a2a-ap2" }
          a2a-web-client = { path = "../a2a-rs/a2a-client" }
          PATCH
          echo "--- appended:"; tail -8 Cargo.toml

      # Prove the patch took, before spending a build on it. A canary that
      # resolved a2a-rs from the registry would pass no matter what this PR
      # does, which is worse than having no canary.
      - name: Verify korps resolves a2a-rs to this PR
        if: steps.guard.outputs.run == 'true'
        working-directory: korps
        run: |
          set -euo pipefail
          src=$(cargo metadata --format-version 1                 | python3 -c "import json,sys; print(next(p['manifest_path'] for p in json.load(sys.stdin)['packages'] if p['name']=='a2a-rs'))")
          echo "a2a-rs resolves to: $src"
          case "$src" in
            "$GITHUB_WORKSPACE"/a2a-rs/a2a-rs/Cargo.toml)
              echo "ok: building against this PR" ;;
            *)
              echo "::error::a2a-rs resolved to $src, not this PR's checkout — the patch did not take, so this job would prove nothing."
              exit 1 ;;
          esac

      # Deliberately not `--locked`. The patch changes what resolves, so korps'
      # committed lockfile no longer matches by construction.
      - name: Build korps against it
        if: steps.guard.outputs.run == 'true'
        working-directory: korps
        run: cargo build --workspace --all-targets

      # The feature-gated targets are where korps' last two breakages were, and
      # a default build compiles neither.
      - name: Build every feature-gated target
        if: steps.guard.outputs.run == 'true'
        working-directory: korps
        run: cargo build -p korps -p korps-fleet --all-targets --all-features

      - name: Test korps against it
        if: steps.guard.outputs.run == 'true'
        working-directory: korps
        run: cargo test --workspace --all-targets
