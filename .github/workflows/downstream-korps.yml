name: Downstream canary (korps)

# Nothing in this repo depends on korps, so the compiler never sees a change
# that breaks it. The shared workspace used to catch that; since the platform
# moved out, this job is the replacement.
#
# It does not wait on a release. korps carries `[patch.crates-io]` pointing at
# `../a2a-rs`, so checking both repos out as siblings builds korps against *this
# PR's* source:
#
#   $GITHUB_WORKSPACE/a2a-rs   <- the PR
#   $GITHUB_WORKSPACE/korps    <- built against it
#
# Two setup steps are needed before this is worth trusting:
#
#  1. korps is a private repo, so cloning it from this public one needs a PAT
#     with `repo` scope in the `KORPS_CANARY_TOKEN` secret. Without it the job
#     skips rather than fails, so forks and PRs without access stay green.
#  2. korps' master has to be current. While it lags, this builds an old korps
#     against new a2a-rs and can fail for reasons that have nothing to do with
#     the PR — which is why it is advisory today.
#
# Drop `continue-on-error` and make it a required check once both hold.

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  korps:
    name: korps builds against this PR
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Is the canary configured?
        id: guard
        env:
          TOKEN: ${{ secrets.KORPS_CANARY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Downstream canary skipped::KORPS_CANARY_TOKEN is not set, so korps cannot be cloned. See the header of .github/workflows/downstream-korps.yml."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out a2a-rs (this PR)
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          path: a2a-rs

      - name: Check out korps
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          repository: EmilLindfors/korps
          token: ${{ secrets.KORPS_CANARY_TOKEN }}
          path: korps

      - name: Install Rust toolchain
        if: steps.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        if: steps.guard.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: korps

      # Deliberately not `--locked`. korps' lockfile pins the versions its
      # patched checkout resolved to; a PR here that bumps one would fail on the
      # lock rather than on the thing this job exists to find. Letting cargo
      # re-resolve is the point — that is what a korps developer will hit.
      - name: Build korps against it
        if: steps.guard.outputs.run == 'true'
        working-directory: korps
        run: cargo build --workspace --all-targets

      # The feature-gated targets are where korps' last two breakages were, and
      # a default build compiles neither.
      - name: Build every feature-gated target
        if: steps.guard.outputs.run == 'true'
        working-directory: korps
        run: cargo build -p korps -p korps-fleet --all-targets --all-features

      - name: Test korps against it
        if: steps.guard.outputs.run == 'true'
        working-directory: korps
        run: cargo test --workspace --all-targets
