name: Rust CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # Run JavaScript actions still pinned to the deprecated Node 20 runtime on
  # Node 24, silencing the per-run deprecation annotation until they update.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --verbose --locked

      - name: Run tests
        run: cargo test --verbose --workspace --locked --all-targets

  postgres:
    name: PostgreSQL storage
    runs-on: ubuntu-latest
    # The SQLite half of `SqlxTaskStorage` runs in the job above. This is the
    # other backend, and it is the one that needs a server: the schema, the two
    # upserts, the placeholder rewrite and every column the driver decodes are
    # per-dialect, and nothing else proves them.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: a2a
          POSTGRES_DB: a2a
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run the PostgreSQL storage tests
        env:
          A2A_TEST_POSTGRES_URL: postgres://postgres:a2a@localhost:5432/a2a
        run: cargo test -p a2a-rs --features full --locked --test postgres_storage_test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Run clippy on a2a-rs with all features (the core crate supports --all-features)
      - name: Run clippy (a2a-rs, all features)
        run: cargo clippy -p a2a-rs --all-targets --all-features -- -D warnings

      # Run clippy on other workspace crates that support --all-features
      - name: Run clippy (a2a-ap2, a2a-web-client, a2a-llm)
        run: cargo clippy -p a2a-ap2 -p a2a-web-client -p a2a-llm --all-targets --all-features -- -D warnings


  rustfmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Doc Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Check docs per-crate to avoid mcp-related path dep issues
      - name: Check documentation (a2a-rs)
        run: cargo doc --no-deps --all-features -p a2a-rs

      - name: Check documentation (other crates)
        run: cargo doc --no-deps -p a2a-ap2 -p a2a-web-client -p a2a-llm


  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run cargo-audit
        run: cargo audit --ignore RUSTSEC-2023-0071

