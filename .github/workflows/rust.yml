name: Rust CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # Run JavaScript actions still pinned to the deprecated Node 20 runtime on
  # Node 24, silencing the per-run deprecation annotation until they update.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --verbose --locked

      - name: Run tests
        run: cargo test --verbose --workspace --locked --all-targets

  msrv:
    name: MSRV (1.96)
    runs-on: ubuntu-latest
    # `rust-version` is a claim cargo never checks against the dependency graph:
    # it errors when the *toolchain* is below a dependency's floor, never when
    # the declared number is. Every other job runs on stable, which proved the
    # claim only while stable *was* 1.96. It no longer is, so this job is what
    # keeps the number true. Bump it and `[workspace.package] rust-version`
    # together — they are the same claim written twice.
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Library targets only. `rust-version` is what a consumer needs to build
      # the published crates; the dev-dependencies behind `--all-targets` have
      # their own floors and would raise ours for nobody's benefit.
      - name: Check the workspace on the declared MSRV
        run: cargo check --workspace --all-features --locked

  postgres:
    name: PostgreSQL storage
    runs-on: ubuntu-latest
    # The SQLite half of `SqlxTaskStorage` runs in the job above. This is the
    # other backend, and it is the one that needs a server: the schema, the two
    # upserts, the placeholder rewrite, the retention sweep and every column the
    # driver decodes are per-dialect, and nothing else proves them.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: a2a
          POSTGRES_DB: a2a
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run the PostgreSQL storage tests
        env:
          A2A_TEST_POSTGRES_URL: postgres://postgres:a2a@localhost:5432/a2a
        # `retention_test` skips its PostgreSQL cases without the URL, so it runs
        # in the job above too — with only the in-memory and SQLite stores. Here
        # it creates a database per case (the sweep is global) and sweeps for
        # real.
        run: |
          cargo test -p a2a-rs --features full --locked --test postgres_storage_test
          cargo test -p a2a-rs --features full --locked --test retention_test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Run clippy on a2a-rs with all features (the core crate supports --all-features)
      - name: Run clippy (a2a-rs, all features)
        run: cargo clippy -p a2a-rs --all-targets --all-features -- -D warnings

      # Run clippy on other workspace crates that support --all-features
      - name: Run clippy (a2a-ap2, a2a-web-client, a2a-llm)
        run: cargo clippy -p a2a-ap2 -p a2a-web-client -p a2a-llm --all-targets --all-features -- -D warnings


  rustfmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Doc Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Check docs per-crate to avoid mcp-related path dep issues
      - name: Check documentation (a2a-rs)
        run: cargo doc --no-deps --all-features -p a2a-rs

      - name: Check documentation (other crates)
        run: cargo doc --no-deps -p a2a-ap2 -p a2a-web-client -p a2a-llm


  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run cargo-audit
        run: cargo audit --ignore RUSTSEC-2023-0071

